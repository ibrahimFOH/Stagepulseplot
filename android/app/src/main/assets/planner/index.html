<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StagePulse Stage Planner</title><link rel="stylesheet" href="style.css"></head><body><header><div><b>StagePulse Stage Planner</b><span>Sahne • Rider • Ekipman</span></div><div class="actions"><button id="newBtn">Yeni</button><button id="saveBtn">Kaydet</button><button id="exportBtn">JSON</button><button id="printBtn">Yazdır</button></div></header><main><aside><input id="search" placeholder="Ekipman / enstrüman ara…"><div class="tabs"><button class="tab active" data-cat="all">Tümü</button><button class="tab" data-cat="instrument">Enstrüman</button><button class="tab" data-cat="pa">PA</button><button class="tab" data-cat="console">Konsol</button><button class="tab" data-cat="stage">Sahne</button></div><div id="library"></div><label class="upload">+ Görsel ekle<input id="imageInput" type="file" accept="image/*"></label></aside><section class="workspace"><div class="toolbar"><label>En <input id="stageW" type="number" value="10"> m</label><label>Derinlik <input id="stageD" type="number" value="8"> m</label><label><input id="grid" type="checkbox" checked> Izgara</label><button id="clearBtn">Sahneyi temizle</button></div><div id="stage" class="stage grid"><div class="stage-label">SAHNE ÖNÜ</div></div><div class="hint">Kütüphaneden sürükle. Nesneleri taşı ve döndür. Kendi ekipman görselini ekleyebilirsin.</div></section></main><script src="app.js"></script></body></html>
