plugins { id 'com.android.application' }

android {
    namespace 'com.stagepulse.mix'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stagepulse.mix'
        minSdk 26
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
    }

    def hasReleaseSigning = System.getenv('STAGEPULSE_KEYSTORE_PATH')
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(System.getenv('STAGEPULSE_KEYSTORE_PATH'))
                storePassword System.getenv('STAGEPULSE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STAGEPULSE_KEY_ALIAS')
                keyPassword System.getenv('STAGEPULSE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
