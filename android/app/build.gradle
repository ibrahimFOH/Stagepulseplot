plugins { id 'com.android.application' }

android {
    namespace 'com.stagepulse.mix'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stagepulse.mix'
        minSdk 26
        targetSdk 35
        versionCode 902
        versionName '0.9.2'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('STAGEPULSE_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('STAGEPULSE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STAGEPULSE_KEY_ALIAS')
                keyPassword System.getenv('STAGEPULSE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
