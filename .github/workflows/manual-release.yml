name: StagePulse Plot Manual Release
run-name: StagePulse Plot Manual Release ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Release StagePulse Plot 2.0.0'
        required: true
        default: 'RELEASE'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

jobs:
  release:
    if: ${{ inputs.confirm == 'RELEASE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate JavaScript and bundled planner
        run: |
          set -euo pipefail
          node --check planner/app.js
          node --check planner/rider.js
          node --check planner/equipment-catalog.js
          node --check android/app/src/main/assets/planner/app.js
          node --check android/app/src/main/assets/planner/rider.js
          node --check android/app/src/main/assets/planner/equipment-catalog.js
          for f in app.js index.html style.css rider.js rider.css equipment-catalog.js; do cmp -s "planner/$f" "android/app/src/main/assets/planner/$f"; done
          grep -F 'equipment-catalog.js?v=10' planner/index.html
          grep -F 'equipment-catalog.js?v=10' android/app/src/main/assets/planner/index.html
          test -s planner/stagepulse-logo.svg
          test -s android/app/src/main/assets/planner/stagepulse-logo.svg
      - name: Validate external catalog images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalog-images"
          grep -oE "img:'https?://[^']+" planner/equipment-catalog.js | sed "s/^img:'//" | while IFS= read -r url; do
            safe=$(printf '%s' "$url" | sha256sum | cut -d' ' -f1)
            body="$RUNNER_TEMP/catalog-images/$safe"
            code=$(curl -L --fail --silent --show-error --max-time 30 -A 'StagePulsePlot-CI/1.0' -o "$body" -w '%{http_code}' "$url")
            test "$code" = "200"
            mime=$(file --brief --mime-type "$body")
            case "$mime" in image/*) ;; *) echo "INVALID IMAGE MIME: $mime $url"; exit 1;; esac
            test -s "$body"
            echo "IMAGE OK: $mime $url"
          done
      - name: Prepare signing keystore
        env:
          STAGEPULSE_KEYSTORE_BASE64: ${{ secrets.STAGEPULSE_KEYSTORE_BASE64 }}
          STAGEPULSE_KEYSTORE_PASSWORD: ${{ secrets.STAGEPULSE_KEYSTORE_PASSWORD }}
          STAGEPULSE_KEY_ALIAS: ${{ secrets.STAGEPULSE_KEY_ALIAS }}
          STAGEPULSE_KEY_PASSWORD: ${{ secrets.STAGEPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STAGEPULSE_KEYSTORE_BASE64"
          test -n "$STAGEPULSE_KEYSTORE_PASSWORD"
          test -n "$STAGEPULSE_KEY_ALIAS"
          test -n "$STAGEPULSE_KEY_PASSWORD"
          printf '%s' "$STAGEPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stagepulse-release.keystore"
          test -s "$RUNNER_TEMP/stagepulse-release.keystore"
          echo "STAGEPULSE_KEYSTORE_PATH=$RUNNER_TEMP/stagepulse-release.keystore" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEYSTORE_PASSWORD=$STAGEPULSE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEY_ALIAS=$STAGEPULSE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEY_PASSWORD=$STAGEPULSE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "package: name='com.stagepulse.mix' versionCode='20000' versionName='2.0.0'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "application-label:'StagePulse Plot'"
          unzip -l "$APK" | grep -F 'assets/planner/rider.js'
          unzip -l "$APK" | grep -F 'assets/planner/rider.css'
          unzip -l "$APK" | grep -F 'assets/planner/index.html'
          unzip -l "$APK" | grep -F 'assets/planner/app.js'
          unzip -l "$APK" | grep -F 'assets/planner/equipment-catalog.js'
          unzip -l "$APK" | grep -F 'assets/planner/stagepulse-logo.svg'
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Android runtime UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.stagepulse.mix 1
            sleep 8
            adb shell dumpsys activity activities | grep -F 'com.stagepulse.mix/.StagePlannerActivity'
            adb shell pidof com.stagepulse.mix
            if adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime'; then exit 1; fi
            adb shell am force-stop com.stagepulse.mix
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StagePulse-Plot-2.0.0-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
      - name: Prepare public update channel
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          rm -rf pages
          mkdir -p pages/updates
          cp "$APK" pages/updates/StagePulse-Plot-2.0.0.apk
          cat > pages/updates/latest.json <<EOF
          {
            "package": "com.stagepulse.mix",
            "version": "2.0.0",
            "versionCode": 20000,
            "apk": "https://ibrahimfoh.github.io/Stagepulseplot/updates/StagePulse-Plot-2.0.0.apk",
            "sha256": "$SHA256"
          }
          EOF
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>StagePulse Plot Updates</title></head><body><h1>StagePulse Plot Updates</h1></body></html>' > pages/index.html
          touch pages/.nojekyll
          test -s pages/updates/latest.json
          test -s pages/updates/StagePulse-Plot-2.0.0.apk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload update channel to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy update channel
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public update channel
        env:
          UPDATE_MANIFEST: https://ibrahimfoh.github.io/Stagepulseplot/updates/latest.json
          UPDATE_APK: https://ibrahimfoh.github.io/Stagepulseplot/updates/StagePulse-Plot-2.0.0.apk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/update-check"
          curl -L --fail --silent --show-error --max-time 30 "$UPDATE_MANIFEST" -o "$RUNNER_TEMP/update-check/latest.json"
          python3 - <<'PY'
          import json, os, re
          p=os.path.join(os.environ['RUNNER_TEMP'],'update-check','latest.json')
          data=json.load(open(p, encoding='utf-8'))
          assert data['package']=='com.stagepulse.mix'
          assert data['version']=='2.0.0'
          assert data['versionCode']==20000
          assert data['apk']==os.environ['UPDATE_APK']
          assert re.fullmatch(r'[0-9a-fA-F]{64}', data['sha256'])
          print('UPDATE MANIFEST OK')
          PY
          curl -L --fail --silent --show-error --max-time 60 "$UPDATE_APK" -o "$RUNNER_TEMP/update-check/update.apk"
          test -s "$RUNNER_TEMP/update-check/update.apk"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/update-check/update.apk" | awk '{print $1}')
          EXPECTED=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/update-check/latest.json'))['sha256'])")
          test "$ACTUAL" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/update-check/update.apk"
          echo "UPDATE APK SHA256 VERIFIED: $ACTUAL"
