name: StagePulseMix Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
  PAGES_BASE_URL: https://ibrahimfoh.github.io/StagepulseMix

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node project
        run: |
          npm ci
          npm run check
          npm test
          npm run package:source

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          STAGEPULSE_KEYSTORE_BASE64: ${{ secrets.STAGEPULSE_KEYSTORE_BASE64 }}
          STAGEPULSE_KEYSTORE_PASSWORD: ${{ secrets.STAGEPULSE_KEYSTORE_PASSWORD }}
          STAGEPULSE_KEY_ALIAS: ${{ secrets.STAGEPULSE_KEY_ALIAS }}
          STAGEPULSE_KEY_PASSWORD: ${{ secrets.STAGEPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STAGEPULSE_KEYSTORE_BASE64"
          test -n "$STAGEPULSE_KEYSTORE_PASSWORD"
          test -n "$STAGEPULSE_KEY_ALIAS"
          test -n "$STAGEPULSE_KEY_PASSWORD"
          printf '%s' "$STAGEPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stagepulse-release.keystore"
          test -s "$RUNNER_TEMP/stagepulse-release.keystore"
          echo "STAGEPULSE_KEYSTORE_PATH=$RUNNER_TEMP/stagepulse-release.keystore" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEYSTORE_PASSWORD=$STAGEPULSE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEY_ALIAS=$STAGEPULSE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEY_PASSWORD=$STAGEPULSE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "package: name='com.stagepulse.mix' versionCode='10000' versionName='1.0.0'"

      - name: Calculate SHA256
        id: hash
        run: |
          set -euo pipefail
          SHA=$(sha256sum android/app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  app-release.apk" > android/app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Build public update site
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          v = os.environ['VERSION']
          major, minor, patch = [int(x) for x in v.split('.')]
          code = major * 10000 + minor * 100 + patch
          payload = {
              'version': v,
              'versionCode': code,
              'apk': f"{os.environ['PAGES_BASE_URL']}/app-release.apk",
              'sha256': os.environ['SHA256'],
              'notes': f'StagePulseMix {v}'
          }
          site = Path('site')
          site.mkdir(parents=True, exist_ok=True)
          (site / 'latest.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          (site / 'index.html').write_text('<!doctype html><meta charset="utf-8"><title>StagePulseMix Updates</title><p>StagePulseMix automatic update distribution.</p>', encoding='utf-8')
          (site / '.nojekyll').write_text('', encoding='utf-8')
          PY
          cp android/app/build/outputs/apk/release/app-release.apk site/app-release.apk
          cp android/app/build/outputs/apk/release/SHA256SUMS.txt site/SHA256SUMS.txt
          test -s site/latest.json
          test -s site/app-release.apk

      - name: Configure GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish repository manifest pointer
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          v = os.environ['VERSION']
          major, minor, patch = [int(x) for x in v.split('.')]
          code = major * 10000 + minor * 100 + patch
          payload = {
              'version': v,
              'versionCode': code,
              'apk': f"{os.environ['PAGES_BASE_URL']}/app-release.apk",
              'sha256': os.environ['SHA256'],
              'notes': f'StagePulseMix {v}'
          }
          Path('latest.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "Publish update manifest ${TAG}"
          git push origin HEAD:main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StagePulseMix-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: StagePulseMix-source
          path: dist/StagePulseMix-source.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
