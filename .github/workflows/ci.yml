name: StagePulse Plot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Validate planner JavaScript
        run: |
          set -euo pipefail
          node --check planner/app.js
          node --check planner/rider.js
          node --check planner/equipment-catalog.js
          node --check android/app/src/main/assets/planner/app.js
          node --check android/app/src/main/assets/planner/rider.js
          node --check android/app/src/main/assets/planner/equipment-catalog.js
      - name: Verify bundled planner is synchronized
        run: |
          set -euo pipefail
          for f in app.js index.html style.css rider.js rider.css equipment-catalog.js; do
            cmp -s "planner/$f" "android/app/src/main/assets/planner/$f"
          done
          node <<'NODE'
          const fs=require('fs');
          const normalize=p=>fs.readFileSync(p,'utf8').replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').trimEnd();
          if(normalize('planner/equipment-catalog.js')!==normalize('android/app/src/main/assets/planner/equipment-catalog.js')) throw new Error('equipment-catalog.js content mismatch between web and Android bundles');
          NODE
          grep -F 'equipment-catalog.js?v=11' planner/index.html
          grep -F 'equipment-catalog.js?v=11' android/app/src/main/assets/planner/index.html
          test -s planner/equipment-catalog.js
          test -s android/app/src/main/assets/planner/equipment-catalog.js
          test -s planner/stagepulse-logo.svg
          test -s android/app/src/main/assets/planner/stagepulse-logo.svg
      - name: Validate external catalog images
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('planner/equipment-catalog.js','utf8');
          const m=s.match(/window\.StagePulseEquipmentCatalog=({[\s\S]*});\s*$/);
          if(!m) throw new Error('Catalog object not found');
          const obj=Function(`"use strict"; return (${m[1]});`)();
          const items=obj.items||[];
          if(!items.length) throw new Error('Catalog is empty');
          const external=items.filter(x=>typeof x.img==='string' && /^https?:\/\//i.test(x.img));
          if(external.length) throw new Error(`External catalog image source remains: ${external.map(x=>x.name).join(', ')}`);
          console.log(`No external catalog image sources: ${items.length} catalog images are embedded.`);
          NODE
      - name: Validate catalog quality rules
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('planner/equipment-catalog.js','utf8');
          const m=s.match(/window\.StagePulseEquipmentCatalog=({[\s\S]*});\s*$/);
          if(!m) throw new Error('Catalog object not found');
          const obj=Function(`"use strict"; return (${m[1]});`)();
          const items=obj.items||[];
          if(obj.version!==8) throw new Error(`Unexpected catalog version: ${obj.version}`);
          if(items.length < 30) throw new Error(`Catalog too small: ${items.length}`);
          const allowed=['console','instrument','pa','stage','light','production'];
          for(const [i,x] of items.entries()){
            if(!x.name || !x.cat || !allowed.includes(x.cat)) throw new Error(`Invalid catalog entry ${i}`);
            if(!x.img) throw new Error(`Missing image ${x.name}`);
            if(!(Number(x.w)>0 && Number(x.h)>0)) throw new Error(`Invalid dimensions ${x.name}`);
          }
          if(items.some(x=>x.blend)) throw new Error(`Blend-mode image workaround remains: ${items.filter(x=>x.blend).map(x=>x.name).join(', ')}`);
          if(items.some(x=>/^https?:\/\//i.test(x.img))) throw new Error(`External catalog image source remains: ${items.filter(x=>/^https?:\/\//i.test(x.img)).map(x=>x.name).join(', ')}`);
          for(const x of items){
            if(typeof x.img!=='string' || !x.img) throw new Error(`Missing image source for ${x.name}`);
            if(/^https?:\/\//i.test(x.img)) throw new Error(`External image source remains: ${x.name}`);
            if(x.img.startsWith('data:image/')) {
              if(!/^data:image\/(svg\+xml|png);/i.test(x.img)) throw new Error(`Unsupported embedded image format: ${x.name}`);
            } else if(!/^img\/.+\.(png|svg|jpg|jpeg|webp)$/i.test(x.img)) {
              throw new Error(`Unsupported local image path: ${x.name} -> ${x.img}`);
            }
          }
          console.log(`CATALOG RULES OK: ${items.length} embedded images`);
          NODE
      - name: Validate all tracked planner assets
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const tracked=execFileSync('git',['ls-files','planner/img'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const text=fs.readFileSync('planner/equipment-catalog.js','utf8');
          const m=text.match(/window\.StagePulseEquipmentCatalog=({[\s\S]*});\s*$/);
          if(!m) throw new Error('Catalog object not found');
          const obj=Function(`"use strict"; return (${m[1]});`)();
          const items=obj.items||[];
          for(const x of items){
            if(typeof x.img!=='string' || !x.img.startsWith('img/')) continue;
            const p='planner/'+x.img;
            if(!tracked.includes(p)) throw new Error(`Catalog image missing from git index: ${p}`);
          }
          const bad=tracked.filter(p=>!(/\.(png|svg|jpg|jpeg|webp)$/i.test(p)));
          if(bad.length) throw new Error(`Unsupported planner image files: ${bad.join(', ')}`);
          console.log(`PLANNER ASSETS OK: ${tracked.length} image files`);
          NODE
      - name: Validate planner behavior contracts
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('planner/app.js','utf8');
          const rider=fs.readFileSync('planner/rider.js','utf8');
          const html=fs.readFileSync('planner/index.html','utf8');
          for(const needle of ["localStorage.setItem('stagepulsePlot'",'URL.createObjectURL','FileReader','crypto.randomUUID']) if(!app.includes(needle)) throw new Error(`Missing planner hook: ${needle}`);
          for(const needle of ['openRider','printRider','equipmentRows','addInput','addOutput','renumberInputs','renumberOutputs']) if(!rider.includes(needle)) throw new Error(`Missing rider hook: ${needle}`);
          if(!html.includes('id="riderBtn"') || !html.includes('onclick=openRider')) throw new Error('Rider button binding missing');
          NODE
      - name: Validate update mechanism
        run: |
          set -euo pipefail
          grep -F 'https://ibrahimfoh.github.io/Stagepulseplot/updates/latest.json' android/app/src/main/java/com/stagepulse/mix/AppUpdater.java
          grep -F 'SHA-256 mismatch' android/app/src/main/java/com/stagepulse/mix/AppUpdater.java
          grep -F 'application/vnd.android.package-archive' android/app/src/main/java/com/stagepulse/mix/AppUpdater.java
          grep -F 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -F 'setDomStorageEnabled(true)' android/app/src/main/java/com/stagepulse/mix/StagePlannerActivity.java
      - name: Prepare signing keystore
        env:
          STAGEPULSE_KEYSTORE_BASE64: ${{ secrets.STAGEPULSE_KEYSTORE_BASE64 }}
          STAGEPULSE_KEYSTORE_PASSWORD: ${{ secrets.STAGEPULSE_KEYSTORE_PASSWORD }}
          STAGEPULSE_KEY_ALIAS: ${{ secrets.STAGEPULSE_KEY_ALIAS }}
          STAGEPULSE_KEY_PASSWORD: ${{ secrets.STAGEPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STAGEPULSE_KEYSTORE_BASE64"
          test -n "$STAGEPULSE_KEYSTORE_PASSWORD"
          test -n "$STAGEPULSE_KEY_ALIAS"
          test -n "$STAGEPULSE_KEY_PASSWORD"
          printf '%s' "$STAGEPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stagepulse-release.keystore"
          test -s "$RUNNER_TEMP/stagepulse-release.keystore"
          echo "STAGEPULSE_KEYSTORE_PATH=$RUNNER_TEMP/stagepulse-release.keystore" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEYSTORE_PASSWORD=$STAGEPULSE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEY_ALIAS=$STAGEPULSE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "STAGEPULSE_KEY_PASSWORD=$STAGEPULSE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Inspect signed APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "package: name='com.stagepulse.mix' versionCode='20000' versionName='2.0.0'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "application-label:'StagePulse Plot'"
          unzip -l "$APK" | grep -F "assets/planner/rider.js"
          unzip -l "$APK" | grep -F "assets/planner/rider.css"
          unzip -l "$APK" | grep -F "assets/planner/index.html"
          unzip -l "$APK" | grep -F "assets/planner/app.js"
          unzip -l "$APK" | grep -F "assets/planner/equipment-catalog.js"
          unzip -l "$APK" | grep -F "assets/planner/stagepulse-logo.svg"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          SIZE=$(stat -c '%s' "$APK")
          test "$SIZE" -gt 10000
      - name: Android runtime APK sanity test
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "package: name='com.stagepulse.mix' versionCode='20000' versionName='2.0.0'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "application-label:'StagePulse Plot'"
          unzip -t "$APK" >/dev/null

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StagePulse-Plot-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
