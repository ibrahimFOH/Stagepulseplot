name: StagePulseMix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: npm run check
      - name: Test
        run: npm test
      - name: Build source package
        run: npm run package:source
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: StagePulseMix-source
          path: dist/StagePulseMix-source.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Inspect APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -E "package: name='com.stagepulse.mix' versionCode='10000' versionName='1.0.0'"
          test -z "$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" 2>&1 || true)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StagePulseMix-release-apk
          path: android/app/build/outputs/apk/release/*.apk
