name: StagePulse Stage Planner CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Inspect APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "package: name='com.stagepulse.mix' versionCode='20000' versionName='2.0.0'"
          SIZE=$(stat -c '%s' "$APK")
          test "$SIZE" -gt 10000
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StagePulseMix-stage-planner-apk
          path: android/app/build/outputs/apk/release/*.apk
