name: StagePulseMix Pages Update Distribution

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build placeholder update site
        run: |
          set -euo pipefail
          mkdir -p site
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>StagePulseMix Updates</title>
          <p>StagePulseMix automatic update distribution.</p>
          EOF
          printf '%s\n' '{"version":"1.0.0","versionCode":10000,"apk":"https://ibrahimfoh.github.io/StagepulseMix/app-release.apk","sha256":"","notes":"StagePulseMix 1.0.0"}' > site/latest.json
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
