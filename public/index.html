<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>StagePulseMix</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>StagePulseMix</h1>
      <span id="connection">Bağlantı yok</span>
    </div>
    <div class="connection-controls">
      <input id="host" placeholder="X32 IP" inputmode="decimal" aria-label="X32 IP adresi">
      <button id="connect">Bağlan</button>
      <button id="disconnect" disabled>Kes</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <button data-view="inputs" class="active">Inputs</button>
      <button data-view="buses">Bus</button>
      <button data-view="dcas">DCA</button>
      <button data-view="main">Main</button>
      <button data-view="routing">Routing</button>
      <button data-view="scenes">Scenes</button>
    </section>

    <section id="view-inputs" class="view active-view">
      <div id="input-strips" class="strip-grid"></div>
    </section>
    <section id="view-buses" class="view"><div id="bus-strips" class="strip-grid"></div></section>
    <section id="view-dcas" class="view"><div id="dca-strips" class="strip-grid"></div></section>
    <section id="view-main" class="view"><div id="main-controls"></div></section>
    <section id="view-routing" class="view"><pre id="routing-state">Bağlantı bekleniyor.</pre></section>
    <section id="view-scenes" class="view"><pre id="scene-state">Bağlantı bekleniyor.</pre></section>
  </main>

  <template id="strip-template">
    <article class="strip">
      <h3 class="strip-title"></h3>
      <meter class="meter" min="0" max="1" value="0"></meter>
      <input class="fader" type="range" min="-90" max="10" step="0.1" value="0">
      <div class="strip-actions">
        <button class="mute">M</button>
        <button class="solo">S</button>
      </div>
      <label>Pan <input class="pan" type="range" min="-1" max="1" step="0.01" value="0"></label>
    </article>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
